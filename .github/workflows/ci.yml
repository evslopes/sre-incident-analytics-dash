name: CI — Pytest, Synthetic Telemetry & Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Python ${{ matrix.python-version }} (Pytest + Report Smoke)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest Unit & Integration Suite
        run: pytest -v

      - name: Smoke-test CLI synthetic generator and executive HTML export
        run: |
          sre-analytics generate-data --rows 1200 --seed 42 --output data/ci_incidents.csv
          sre-analytics export-report --input data/ci_incidents.csv --output reports/ci_report.html
          sre-analytics summary --input data/ci_incidents.csv

  docker:
    name: Validate Production Gunicorn Container
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sre-incident-analytics-dash:ci .
